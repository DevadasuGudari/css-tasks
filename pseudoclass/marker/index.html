<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Teams</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #eef3f8;
        }

        header {
            background: #003366;
            color: white;
            text-align: center;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        header h1 {
            font-size: 32px;
        }

        .card {
            width: 520px;
            margin: 40px auto;
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            text-align: center;
            color: #003366;
            margin-bottom: 20px;
        }

        .ipl-list {
            padding-left: 30px;
        }

        .ipl-list li {
            font-size: 20px;
            line-height: 2;
            color: #333;
            transition: 0.3s;
        }
        .csk::marker {
            color: #FFD700;
        }

        .mi::marker {
            color: #005DAA;
        }

        .rcb::marker {
            color: #D71920;
        }

        .kkr::marker {
            color: #4B0082;
        }

        .srh::marker {
            color: #FF6A00;
        }

        .rr::marker {
            color: #EA1A85;
        }

        .dc::marker {
            color: #0078BC;
        }

        .pbks::marker {
            color: #C8102E;
        }

        .gt::marker {
            color: #1C2C5B;
        }

        .lsg::marker {
            color: #00AEEF;
        }
    </style>
</head>

<body>

    <header>
        <h1>Indian Premier League (IPL) Teams</h1>
    </header>

    <div class="card">
        <h2>IPL Teams</h2>

        <ul class="ipl-list">
            <li class="csk">Chennai Super Kings</li>
            <li class="mi">Mumbai Indians</li>
            <li class="rcb">Royal Challengers Bengaluru</li>
            <li class="kkr">Kolkata Knight Riders</li>
            <li class="srh">Sunrisers Hyderabad</li>
            <li class="rr">Rajasthan Royals</li>
            <li class="dc">Delhi Capitals</li>
            <li class="pbks">Punjab Kings</li>
            <li class="gt">Gujarat Titans</li>
            <li class="lsg">Lucknow Super Giants</li>
        </ul>
    </div>

</body>

</html>
