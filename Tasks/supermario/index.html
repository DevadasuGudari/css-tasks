<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Coin</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }


        .parent {
            width: 120px;
            height: 60px;
            background: #c96d00;
            border: 4px solid #fff;
            position: relative;
            margin-bottom: 100px;
        }

        .child {
            width: 50px;
            height: 50px;
            background: gold;
            border: 4px solid #ffd700;
            border-radius: 50%;
            position: absolute;
            left: 50%;
            bottom: 100%;
            transform: translateX(-50%);
            animation: coin 1s linear infinite;
        }

        .child::before {
            content: "$";
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #b8860b;
            font-size: 28px;
            font-weight: bold;
        }

        @keyframes coin {

            0% {
                transform: translateX(-50%) translateY(0) scale(1) rotateY(0deg);
                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            50% {
                transform: translateX(-50%) translateY(-180px) scale(1.1) rotateY(180deg);
                opacity: 1;
            }

            100% {
                transform: translateX(-50%) translateY(0) scale(1) rotateY(360deg);
                opacity: 0;
            }

        }
    </style>
</head>

<body>

    <div class="parent">
        <div class="child"></div>
    </div>

</body>

</html>
