<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
        }

        .halfmoon {
            position: relative;
            width: 200px;
            height: 200px;
            background-color: yellow;
            border-radius: 50%;
        }
        .halfmoon::after {
            position: absolute;
            content: '';
            width: 100%;
            height: 170px;
            background-color: black;
            border-radius: 50%;
            top: 10px;
            right: 50px;
            left: 50px;
        }
    </style>
</head>

<body>
    <div class="halfmoon"></div>
</body>

</html>
