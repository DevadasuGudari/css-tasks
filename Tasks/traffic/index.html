<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Signal Animation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #87CEEB, #EAFBFF);
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;
        }



        h2 {
            text-align: center;
            margin-top: 20px;
            color: #222;
        }



        .signal {
            position: absolute;
            left: 80px;
            top: 120px;
            width: 90px;
            background: #111;
            padding: 10px;
            border-radius: 12px;
        }

        .light {
            width: 60px;
            height: 60px;
            margin: 10px auto;
            border-radius: 50%;
            background: #444;
        }


        .red {
            animation: redLight 9s infinite;
        }

        .yellow {
            animation: yellowLight 9s infinite;
        }

        .green {
            animation: greenLight 9s infinite;
        }

        @keyframes redLight {

            0%,
            33% {
                background: red;
                box-shadow: 0 0 20px red;
            }

            34%,
            100% {
                background: #444;
                box-shadow: none;
            }
        }

        @keyframes yellowLight {

            0%,
            33% {
                background: #444;
            }

            34%,
            50% {
                background: yellow;
                box-shadow: 0 0 20px yellow;
            }

            51%,
            100% {
                background: #444;
                box-shadow: none;
            }
        }

        @keyframes greenLight {

            0%,
            50% {
                background: #444;
            }

            51%,
            100% {
                background: lime;
                box-shadow: 0 0 20px lime;
            }
        }



        .bike {
            position: absolute;
            top: 650px;
            font-size: 45px;
        }

        .bike1 {
            left: 170px;
            animation: bikeMove 9s linear infinite;
        }

        .bike2 {
            left: 100px;
            animation: bikeMove 9s linear infinite;
            animation-delay: .5s;
        }

        .bike3 {
            left: 30px;
            animation: bikeMove 9s linear infinite;
            animation-delay: 1s;
        }


        @keyframes bikeMove {

            0%,
            50% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(1400px);
            }

        }
    </style>

</head>

<body>

    <div class="container">

        <h2>🚦 Traffic Signal Animation</h2>

        <div class="signal">
            <div class="light red"></div>
            <div class="light yellow"></div>
            <div class="light green"></div>
        </div>

        <div class="bike bike1">🏍️</div>
        <div class="bike bike2">🏍️</div>
        <div class="bike bike3">🏍️</div>

    </div>

</body>

</html>
